name: Intraday Live Scan

# -------------------------------------------------------------
# Runs every 15 minutes DURING NSE market hours (Mon-Fri).
# Alerts fire LIVE as today's daily candle forms - no waiting
# for the close. Times below are IST:
#   09:15 IST kickoff        = 03:45 UTC
#   09:30-15:15 IST scan     = 04:00-09:45 UTC every 15 min
# (the 15:15 IST run is the last one; the end-of-day confirmation
#  run is handled by the "Daily Shakeout Scan" workflow at 16:30 IST)
#
# ⚠️ GitHub Actions minutes: this workflow consumes ~1-3 min per run
#    (watchlist of ~100 symbols). 26 runs/day x 22 days ≈ 600-1700
#    min/month - stay under the 2000 free minutes by keeping
#    watchlist.txt small (<= ~150 symbols). Do NOT use full-universe
#    intraday scans in Actions (would exceed the free tier).
# -------------------------------------------------------------
"on":
  schedule:
    - cron: "45 3 * * 1-5"       # 09:15 IST kickoff
    - cron: "*/15 4-9 * * 1-5"   # every 15 min 09:30-15:15 IST
  workflow_dispatch:
    inputs:
      test_only:
        description: "Only send a Telegram test message (verify secrets)"
        type: boolean
        default: false
      limit:
        description: "Max symbols to scan (0 = use watchlist.txt)"
        type: number
        default: 0
      full_universe:
        description: "Scan whole NSE universe (slow + heavy minutes)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
  DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  live-scan:
    name: Live intraday scan + Telegram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy requests

      # ---- daily history cache (past bars never change, so we reuse them
      #      between the 15-min runs instead of re-downloading every time) ----
      - name: Date stamp
        id: date
        run: echo "today=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore daily bar cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: dhan-daily-${{ steps.date.outputs.today }}
          restore-keys: |
            dhan-daily-

      # ---- verify secrets end-to-end without scanning anything ----
      - name: Telegram connectivity test
        if: github.event_name == 'workflow_dispatch' && inputs.test_only == true
        run: |
          python - <<'EOF'
          import os
          from telegram_notifier import TelegramNotifier
          n = TelegramNotifier(os.environ["TELEGRAM_BOT_TOKEN"],
                               os.environ["TELEGRAM_CHAT_ID"])
          ok = n.send("✅ <b>Shakeout scanner</b> — intraday mode is live.\n"
                      "Secrets OK — test message from GitHub Actions.")
          print("telegram send:", ok)
          if not ok:
              raise SystemExit(1)
          EOF

      # ---- the real intraday scan (skipped when test_only is on) ----
      - name: Run live intraday scan + Telegram alerts
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_only == true) }}
        run: |
          mkdir -p logs
          ARGS="--mode live --intraday --telegram --out logs/intraday_$(date +%F_%H%M).csv"
          if [ "${{ inputs.full_universe }}" == "true" ]; then
            :
          else
            ARGS="$ARGS --watchlist watchlist.txt"
          fi
          if [ "${{ inputs.limit }}" != "" ] && [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          python scanner.py $ARGS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-logs
          path: logs/
          retention-days: 7
