name: Daily Shakeout Scan

# -------------------------------------------------------------
# Runs Mon-Fri at 16:30 IST (11:00 UTC) — after NSE market close
# so the daily candle is final. GitHub Actions cron uses UTC.
# Change the line below if you want a different time
# (e.g. "0 12 * * 1-5" = 17:30 IST).
# Also allows manual runs with options (see "Run workflow").
# -------------------------------------------------------------
"on":
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      test_only:
        description: "Only send a Telegram test message (verify secrets)"
        type: boolean
        default: false
      limit:
        description: "Max symbols to scan (0 = whole NSE universe)"
        type: number
        default: 0
      threshold:
        description: "Minimum score to report (0 = use config default 55)"
        type: number
        default: 0

permissions:
  contents: read

env:
  DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
  DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  # ------------------------------------------------------------------ test
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy requests
      - name: Run test suite
        run: python -m pattern_scanner.tests

  # ------------------------------------------------------------------ scan
  scan:
    name: Live scan + Telegram alerts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy requests

      # ---- verify secrets end-to-end without scanning anything ----
      - name: Telegram connectivity test
        if: github.event_name == 'workflow_dispatch' && inputs.test_only == true
        run: |
          python - <<'EOF'
          import os
          from pattern_scanner.telegram_notifier import TelegramNotifier
          n = TelegramNotifier(os.environ["TELEGRAM_BOT_TOKEN"],
                               os.environ["TELEGRAM_CHAT_ID"])
          ok = n.send("✅ <b>Shakeout scanner</b> is live.\n"
                      "Secrets OK — test message from GitHub Actions.")
          print("telegram send:", ok)
          if not ok:
              raise SystemExit(1)
          EOF

      # ---- the real scan (skipped when test_only is on) ----
      - name: Run live scan + Telegram alerts
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_only == true) }}
        run: |
          mkdir -p logs
          ARGS="--mode live --telegram --out logs/signals_$(date +%F).csv"
          if [ "${{ inputs.limit }}" != "" ] && [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.threshold }}" != "" ] && [ "${{ inputs.threshold }}" != "0" ]; then
            ARGS="$ARGS --threshold ${{ inputs.threshold }}"
          fi
          python -m pattern_scanner.scanner $ARGS

      # ---- attach the CSV so you can download it from the run page ----
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-logs
          path: logs/
          retention-days: 30

      # ---- a short summary on the Actions run page ----
      - name: Write job summary
        if: always()
        run: |
          f="logs/signals_$(date +%F).csv"
          if [ -f "$f" ] && [ -s "$f" ]; then
            echo "## 📈 Signals ($(date +%F))" >> $GITHUB_STEP_SUMMARY
            echo '```csv' >> $GITHUB_STEP_SUMMARY
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No signals today." >> $GITHUB_STEP_SUMMARY
          fi
