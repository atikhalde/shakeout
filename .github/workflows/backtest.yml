name: Backtest

# -------------------------------------------------------------
# Run the shakeout-pattern backtest on REAL Dhan historical data.
# Trigger manually: Actions -> Backtest -> Run workflow.
# Results: signals_backtest.csv artifact + summary on the run page.
#
# Inputs:
#   period     = time period preset (1m, 6m, 1y, 2y, 5y) - overrides years
#   years      = how many years of history (default 5) - used if period is empty
#   limit      = max symbols to scan (0 = whole liquid universe ~2145).
#                Start with 300-500 to see the speed, then go full.
#   min_score  = only report signals with score >= this (default 70)
#
# Cost: ~2145 Dhan calls at 5/sec ≈ 2-4 min + analysis ≈ 5-8 min total.
# -------------------------------------------------------------
"on":
  workflow_dispatch:
    inputs:
      period:
        description: "Time period preset (overrides years)"
        type: choice
        options:
          - ""
          - "1m"
          - "6m"
          - "1y"
          - "2y"
          - "5y"
        default: ""
      years:
        description: "Years of history (ignored if period is set)"
        type: number
        default: 5
      limit:
        description: "Max symbols (0 = all ~2145)"
        type: number
        default: 0
      min_score:
        description: "Minimum signal score"
        type: number
        default: 70
      min_mcap:
        description: "Only liquid stocks >= this mcap in crores (1000 = your rule)"
        type: number
        default: 1000
      no_cache:
        description: "Ignore the daily-bar cache (use ONCE to clear a polluted cache)"
        type: boolean
        default: false
      failover_yfinance:
        description: "Auto-switch to Yahoo data if Dhan keeps rate-limiting (foreign IP friendly)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
  DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}

jobs:
  backtest:
    name: Backtest on Dhan history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy requests openpyxl yfinance

      - name: Restore daily bar cache
        uses: actions/cache@v4
        with:
          path: data/cache
          # STABLE key (no run_id!): the daily-bar cache must be reused
          # across runs - a unique key meant every run re-downloaded all
          # symbols and hammered Dhan's API -> 429s
          key: backtest-dhan-${{ inputs.years }}y
          restore-keys: |
            backtest-dhan-

      - name: Run backtest
        run: |
          ARGS="--source dhan"
          if [ -n "${{ inputs.period }}" ]; then
            ARGS="$ARGS --period ${{ inputs.period }}"
          else
            ARGS="$ARGS --years ${{ inputs.years }}"
          fi
          ARGS="$ARGS --limit ${{ inputs.limit }}"
          ARGS="$ARGS --min-score ${{ inputs.min_score }}"
          ARGS="$ARGS --min-mcap ${{ inputs.min_mcap }}"
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            ARGS="$ARGS --no-cache"
          fi
          ARGS="$ARGS --out signals_backtest.csv"
          python backtest.py $ARGS

      - name: Upload signals (CSV + Excel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-backtest
          path: |
            signals_backtest.csv
            signals_backtest.xlsx
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          if [ -f signals_backtest.csv ] && [ -s signals_backtest.csv ]; then
            echo "## 📊 Backtest signals ($(wc -l < signals_backtest.csv) rows)" \
                 >> $GITHUB_STEP_SUMMARY
            echo '```csv' >> $GITHUB_STEP_SUMMARY
            cat signals_backtest.csv >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No signals." >> $GITHUB_STEP_SUMMARY
          fi
